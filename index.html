<html>
<head>
<style>
    .streak-header {
        text-align: center;
        color: white;
    }

    .game-row {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
    }

    .card {
        border: 2px solid #333;
        border-radius: 20px;
        background-color: white;
        text-align: center;
        width: 220px;
        padding: 16px;
    }

    .game-image {
        width: 100%;
        height: 200px;
        background-color: #ccc;
        border-radius: 12px;
    }
    .VS-text {
        font-size: large;
        font-weight: 900;
        color: white;
    }
    .hl-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
    }
    .hl-buttons button {
        border: none;
        border-radius: 8px;
        padding: 14px 32px;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.15s ease;
    }

    .hl-buttons button:hover {
        transform: scale(1.05);
    }

    .higher-button {
        background-color: #4ade80;
        color: #0d2818;
    }

    .higher-button:hover {
        background-color: #3fc86f;
    }

    .lower-button {
        background-color: #f87171;
        color: #3d0d0d;
    }

    .lower-button:hover {
        background-color: #ef5555;
    }

    body {
        background-color: rgb(0, 0, 110);
    }
</style>
</head>
<body>
<h1 class="streak-header">Streak: <span id="streak-count">0</span></h1>

<div class="game-row">
    <div class="card">
        <div class="game-image"></div>
        <p><span id="game-title">title</span></p>
        <p><span id="score">score</span></p>
    </div>
        <p class="VS-text">VS</p>
    <div class="card">
        <div class="game-image"></div>
        <p><span id="game-title-2">title</span></p>
        <p><span id="score-2">score</span></p>
    </div>
</div>

<div class="hl-buttons">
    <button class="lower-button">Lower</button>
    <button class="higher-button">Higher</button>
</div>

</body>
</html>
